[project]
name = "coat-text-detection"
version = "0.1.0"
description = "Exploratory analysis of the CoAT binary dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "torch>=2.5.0",
]

[project.scripts]
coat-baseline = "coat_eda.baseline:main"
coat-mlp = "coat_eda.mlp:main"
coat-lstm = "coat_eda.lstm:main"
coat-final-eval = "coat_eda.final_evaluation:main"

[dependency-groups]
dev = ["jupyterlab>=4.0", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coat_eda"]
